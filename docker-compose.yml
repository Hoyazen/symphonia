services:

  symphonia_front:
    build:
      context: ./frontend

    # Ci-dessous la redirection du port à décommenter pour les tests en local
    # ports:
    #   - "8080:8080"

    # links permet d'indiquer que les conteneurs peuvent communiquer sur un réseau interne au moteur Docker
    # ici, le conteneur du "front" doit pouvoir échanger avec le conteneur du "back"
    links:
      # TODO
      - symphonia_back
  # Base de données PostgreSQL

  symphonia_back:
    build:
      context: ./backend
      # Ci-dessous la redirection du port à décommenter pour les tests en local
      # ports:
      # - "8000:8000"
    env_file:
      - .env # "depends_on" permet d'indiquer que le conteneur api doit attendre le lancement du conteneur "PostgreSQL" avant de démarrer
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: symphonia-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      # - symphonia_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U symphonia" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serveur mail de test (pour voir les emails envoyés par le backend)
  mailpit:
    image: axllent/mailpit:latest
    container_name: symphonia-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
      - "443:443" # exposition du port 443 (sécurisé)
    volumes:
      # ajout du fichier de configuration du nginx pour en faire un "reverse proxy"
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # ajout du chemin vers les certificats
      - ./nginx:/etc/nginx/conf.d/
    depends_on:
      - symphonia_front
      - symphonia_back
