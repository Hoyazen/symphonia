spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.application.name=backend
server.port=8081

# Désactivation des options pour génération de la documentation API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Base de données PostgreSQL (valeurs lues depuis le fichier .env)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration concernant la gestion ds JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Base de données PostgreSQL (doit correspondre à docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Configuration des emails (meilpit local)
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Configuration des CORS (à adapter en fonction de l'environnement)
# app.cors.origin=http://localhost:3000
app.cors.origin=*
